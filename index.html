<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة - اختبار</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
        body{background:#f5e8d8;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
        .app{max-width:400px;width:100%;background:#fff;border-radius:30px;padding:30px 20px;box-shadow:0 20px 60px rgba(0,0,0,0.1)}
        h1{text-align:center;color:#3d2415;font-size:28px;margin-bottom:4px}
        h1 span{color:#d4833a}
        .sub{text-align:center;color:#8b6b51;font-size:13px;border-bottom:2px solid #f0e0d0;padding-bottom:12px;margin-bottom:20px}
        .form-group{margin-bottom:12px}
        .form-group label{display:block;font-weight:700;color:#4a2c1b;font-size:13px;margin-bottom:4px}
        .form-group input{width:100%;padding:12px 14px;border:2px solid #e8ddd2;border-radius:14px;font-size:14px;outline:none}
        .form-group input:focus{border-color:#d4833a}
        .btn{width:100%;padding:14px;border:none;border-radius:40px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
        .btn-primary{background:#d4833a;color:#fff}
        .btn-primary:hover{background:#b8652e}
        .btn-secondary{background:transparent;color:#d4833a;border:2px solid #d4833a}
        .btn-secondary:hover{background:#fdf3ea}
        .btn-danger{background:#e74c3c;color:#fff}
        .btn-danger:hover{background:#c0392b}
        .divider{text-align:center;color:#b0957e;margin:14px 0;font-size:12px}
        .divider::before,.divider::after{content:'';display:inline-block;width:30%;border-bottom:1px solid #e8ddd2;margin:0 10px;vertical-align:middle}
        .toast{background:#3d2415;color:#fff;padding:12px;border-radius:14px;text-align:center;margin-top:12px;display:none;font-weight:700}
        .toast.success{background:#2d8f4e}
        .toast.error{background:#c0392b}
        .hidden{display:none!important}
        .screen{display:none}
        .screen.active{display:block}
        .demo-box{background:#fdf3ea;border-radius:14px;padding:10px;margin-bottom:14px;text-align:center;font-size:12px;color:#4a2c1b;border:1px solid #f0dcc8}
    </style>
</head>
<body>

<div class="app" id="app">
    <h1><span>خ</span>دمة</h1>
    <div class="sub">منصة التوظيف الأولى للمهنيين والمطاعم</div>
    <div class="toast" id="toast"></div>

    <!-- ====== شاشة الدخول ====== -->
    <div class="screen active" id="loginScreen">
        <div class="demo-box">🔑 <strong>مستخدمين تجريبيين:</strong><br> مهني_محمد / 123456</div>
        <div class="form-group"><label>👤 اسم المستخدم</label><input type="text" id="loginUser" placeholder="أدخل اسم المستخدم"></div>
        <div class="form-group"><label>🔒 كلمة المرور</label><input type="password" id="loginPass" placeholder="••••••••"></div>
        <button class="btn btn-primary" onclick="login()">🚀 دخول</button>
        <div class="divider">ليس لديك حساب؟</div>
        <button class="btn btn-secondary" onclick="showScreen('registerScreen')">📝 إنشاء حساب جديد</button>
    </div>

    <!-- ====== شاشة التسجيل ====== -->
    <div class="screen" id="registerScreen">
        <button onclick="showScreen('loginScreen')" style="background:none;border:none;color:#d4833a;font-weight:700;cursor:pointer;margin-bottom:10px;font-size:14px;">← رجوع</button>
        <h2 style="text-align:center;font-size:20px;color:#4a2c1b;margin-bottom:14px;">إنشاء حساب</h2>
        <div class="form-group"><label>👤 اسم المستخدم</label><input type="text" id="regUser" placeholder="أدخل اسماً فريداً"></div>
        <div class="form-group"><label>🔒 كلمة المرور</label><input type="password" id="regPass" placeholder="6 أحرف على الأقل"></div>
        <div class="form-group"><label>📍 المدينة</label><input type="text" id="regCity" placeholder="الدار البيضاء"></div>
        <div class="form-group"><label>📱 رقم الهاتف</label><input type="tel" id="regPhone" placeholder="0612345678"></div>
        <div class="form-group"><label>🏷️ القطاع</label>
            <select id="regSector" style="width:100%;padding:12px;border:2px solid #e8ddd2;border-radius:14px;font-size:14px;background:#faf7f4;outline:none">
                <option value="مطعم">🍽️ مطعم</option>
                <option value="مخبز">🥖 مخبز</option>
                <option value="مقهى">☕ مقهى</option>
                <option value="سناك">🍔 سناك</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="register()">✅ إنشاء حساب</button>
        <button class="btn btn-secondary" onclick="showScreen('loginScreen')" style="margin-top:8px;">🔙 لدي حساب</button>
    </div>

    <!-- ====== اللوحة الرئيسية ====== -->
    <div class="screen" id="mainScreen">
        <div style="text-align:center;padding:30px 0;">
            <span style="font-size:60px;">✅</span>
            <h2 style="color:#4a2c1b;margin-top:10px;">مرحباً بك!</h2>
            <p style="color:#8b6b51;margin:10px 0 20px;" id="welcomeName">تم تسجيل الدخول</p>
            <button class="btn btn-danger" onclick="logout()">🚪 تسجيل خروج</button>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- 🔥 Firebase (طريقة مباشرة) -->
<!-- ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    // ============================================================
    // 🔥 إعدادات Firebase
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyBllf-5nXOcdhxarDfcqSAPyPRz5J-IiXo",
        authDomain: "wadifti-9c7b1.firebaseapp.com",
        projectId: "wadifti-9c7b1",
        storageBucket: "wadifti-9c7b1.firebasestorage.app",
        messagingSenderId: "814051581766",
        appId: "1:814051581766:web:61fafe5f21c45811d70f47"
    };

    // تهيئة Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    console.log('🔥 Firebase متصل!');

    // ============================================================
    // 📦 دوال الواجهة
    // ============================================================
    function showToast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.display = 'block';
        t.className = 'toast ' + type;
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // ============================================================
    // 🔐 المصادقة
    // ============================================================
    function register() {
        const username = document.getElementById('regUser').value.trim();
        const password = document.getElementById('regPass').value;
        const city = document.getElementById('regCity').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const sector = document.getElementById('regSector').value;

        if (!username || !password || !city || !phone) {
            showToast('❌ املأ جميع الحقول', 'error');
            return;
        }
        if (password.length < 6) {
            showToast('❌ كلمة المرور 6 أحرف على الأقل', 'error');
            return;
        }

        const email = username + '@khdma.app';
        console.log('📧 محاولة التسجيل:', email);

        auth.createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                console.log('✅ تم إنشاء المستخدم:', user.uid);

                return db.collection('users').doc(user.uid).set({
                    username: username,
                    email: email,
                    city: city,
                    phone: phone,
                    sector: sector,
                    role: 'worker',
                    displayName: username,
                    createdAt: new Date().toISOString()
                });
            })
            .then(() => {
                showToast('🎉 تم التسجيل بنجاح!', 'success');
                // تسجيل الدخول تلقائي
            })
            .catch((error) => {
                console.error('❌ خطأ:', error);
                if (error.code === 'auth/email-already-in-use') {
                    showToast('❌ هذا الاسم مستخدم', 'error');
                } else {
                    showToast('❌ ' + error.message, 'error');
                }
            });
    }

    function login() {
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value;

        if (!username || !password) {
            showToast('❌ أدخل اسم المستخدم وكلمة المرور', 'error');
            return;
        }

        const email = username + '@khdma.app';
        console.log('📧 محاولة الدخول:', email);

        auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                console.log('✅ تم تسجيل الدخول:', userCredential.user.uid);
            })
            .catch((error) => {
                console.error('❌ خطأ:', error);
                if (error.code === 'auth/user-not-found') {
                    showToast('❌ هذا المستخدم غير موجود', 'error');
                } else if (error.code === 'auth/wrong-password') {
                    showToast('❌ كلمة المرور غير صحيحة', 'error');
                } else {
                    showToast('❌ ' + error.message, 'error');
                }
            });
    }

    function logout() {
        auth.signOut()
            .then(() => {
                showToast('👋 تم تسجيل الخروج', '');
            })
            .catch((error) => {
                showToast('❌ ' + error.message, 'error');
            });
    }

    // ============================================================
    // 🔄 مراقبة حالة المستخدم
    // ============================================================
    auth.onAuthStateChanged((user) => {
        console.log('🔄 حالة المستخدم:', user ? 'مسجل' : 'غير مسجل');

        if (user) {
            // جلب بيانات المستخدم من Firestore
            db.collection('users').doc(user.uid).get()
                .then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById('welcomeName').textContent = 'مرحباً ' + (data.displayName || data.username) + '!';
                        showScreen('mainScreen');
                    } else {
                        console.warn('⚠️ لا توجد بيانات للمستخدم');
                        showScreen('loginScreen');
                    }
                })
                .catch((error) => {
                    console.error('❌ خطأ في جلب البيانات:', error);
                    showScreen('loginScreen');
                });
        } else {
            showScreen('loginScreen');
        }
    });

    // ============================================================
    // 🚀 جعل الدوال عالمية
    // ============================================================
    window.showScreen = showScreen;
    window.register = register;
    window.login = login;
    window.logout = logout;
    window.showToast = showToast;

    console.log('🥖 تطبيق خدمة - جاهز!');
    console.log('🔑 استخدم: مهني_محمد / 123456 (إذا كان موجوداً)');
</script>

</body>
</html>
