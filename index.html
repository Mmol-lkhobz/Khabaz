<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>خدمة - منصة التوظيف</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal','Segoe UI',sans-serif}
        body{background:linear-gradient(145deg,#fdf6f0,#f5e8d8);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
        .app{max-width:450px;width:100%;background:#fff;border-radius:48px;padding:24px 20px 28px;box-shadow:0 30px 80px rgba(180,100,50,0.18)}
        .header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px}
        .logo{display:flex;align-items:center;gap:8px}
        .logo-icon{font-size:34px}
        .logo-text{font-size:30px;font-weight:900;color:#3d2415;letter-spacing:-1px}
        .logo-text .highlight{color:#d4833a}
        .logo-sub{font-size:10px;font-weight:700;color:#8b6b51;letter-spacing:1px;display:block;margin-top:-2px}
        .subtitle{text-align:center;color:#8b6b51;font-size:12px;padding-bottom:12px;border-bottom:2px solid #f0e0d0;font-weight:700;margin-bottom:16px}
        .subtitle span{color:#d4833a}
        .screen{display:none;animation:fadeUp .4s ease}
        .screen.active{display:block}
        @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .form-group{margin-bottom:12px}
        .form-group label{display:block;font-size:13px;font-weight:700;color:#4a2c1b;margin-bottom:4px}
        .form-group input,.form-group select{width:100%;padding:12px 14px;border:2px solid #e8ddd2;border-radius:14px;font-size:14px;background:#faf7f4;outline:none;transition:.25s;font-family:inherit}
        .form-group input:focus,.form-group select:focus{border-color:#d4833a;background:#fff;box-shadow:0 0 0 4px rgba(212,131,58,0.08)}
        .btn{padding:14px;border:none;border-radius:40px;font-size:16px;font-weight:800;cursor:pointer;transition:.3s;margin-top:4px;width:100%;font-family:inherit}
        .btn:active{transform:scale(.97)}
        .btn-primary{background:linear-gradient(145deg,#d4833a,#b8652e);color:#fff;box-shadow:0 6px 24px rgba(212,131,58,.35)}
        .btn-primary:hover{background:linear-gradient(145deg,#c07230,#a3541e);transform:translateY(-2px)}
        .btn-secondary{background:transparent;color:#d4833a;border:2px solid #d4833a}
        .btn-secondary:hover{background:#fdf3ea}
        .btn-danger{background:#e74c3c;color:#fff}
        .btn-danger:hover{background:#c0392b}
        .divider{display:flex;align-items:center;margin:12px 0;color:#b0957e;font-size:11px;font-weight:500}
        .divider::before,.divider::after{content:'';flex:1;border-bottom:1px solid #e8ddd2}
        .divider::before{margin-left:10px}
        .divider::after{margin-right:10px}
        .btn-back{background:0 0;border:none;color:#d4833a;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:4px 0}
        .hero{text-align:center;margin-bottom:16px}
        .hero-icon{font-size:52px;display:block;margin-bottom:2px}
        .hero-text{color:#8b6b51;font-size:14px;font-weight:700}
        .hero-text span{color:#d4833a}
        .toast{background:#3d2415;color:#fff;padding:12px 18px;border-radius:14px;text-align:center;margin-top:12px;display:none;font-weight:700;font-size:14px}
        .toast.success{background:#2d8f4e}
        .toast.error{background:#c0392b}
        .loading-spinner{text-align:center;padding:20px;color:#8b6b51;font-weight:700}
        .loading-spinner .spinner{display:inline-block;width:30px;height:30px;border:3px solid #f0e0d0;border-top:3px solid #d4833a;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:8px}
        @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        .role-selector{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
        .role-card{flex:1;min-width:70px;padding:12px 8px;border:3px solid #e8ddd2;border-radius:18px;text-align:center;cursor:pointer;transition:.3s;background:#faf7f4}
        .role-card:hover{transform:translateY(-3px)}
        .role-card.active{border-color:#d4833a;background:linear-gradient(135deg,#fdf3ea,#fef8f2);box-shadow:0 4px 24px rgba(212,131,58,.15)}
        .role-card .icon{font-size:28px;display:block}
        .role-card .label{font-weight:800;color:#4a2c1b;font-size:12px;margin-top:3px}
        .role-card .desc{font-size:9px;color:#8b6b51;margin-top:2px;font-weight:500}
        .role-card .check{display:none;color:#2d8f4e;font-size:16px;margin-top:3px}
        .role-card.active .check{display:block}
        .input-error{border-color:#e74c3c!important;background:#fdf2f2!important}
        .demo-box{background:linear-gradient(135deg,#fdf3ea,#fef6ed);border-radius:14px;padding:10px;margin-bottom:14px;text-align:center;font-size:12px;color:#4a2c1b;border:1px solid #f0dcc8}
        .user-badge{background:linear-gradient(135deg,#fef3e7,#fdf3ea);padding:4px 14px;border-radius:40px;font-size:12px;color:#4a2c1b;font-weight:700;display:none;align-items:center;gap:6px;border:1px solid #f0dcc8}
        .btn-logout{background:0 0;border:none;color:#d4833a;font-size:18px;cursor:pointer;display:none;padding:4px 8px;border-radius:50%;background:#fdf6ed}
        .btn-logout:hover{background:#f5e6d3}
        @media(max-width:400px){.app{padding:16px 12px}.logo-text{font-size:24px}.btn{font-size:14px;padding:12px}.role-card{padding:8px 4px}.role-card .icon{font-size:22px}}
    </style>
</head>
<body>

<div class="app" id="app">
    <div class="header">
        <div class="logo">
            <span class="logo-icon">🥖🍽️</span>
            <div>
                <div class="logo-text"><span class="highlight">خ</span>دمة</div>
                <span class="logo-sub">منصة التوظيف</span>
            </div>
        </div>
        <div class="header-right">
            <span class="user-badge" id="userBadge">👋</span>
            <button class="btn-logout" id="logoutBtn" onclick="logout()">🚪</button>
        </div>
    </div>
    <div class="subtitle">🥖 منصة التوظيف الأولى <span>للمهنيين والمطاعم</span> 🍽️</div>
    <div class="toast" id="toast"></div>

    <!-- ====== تسجيل الدخول ====== -->
    <div class="screen active" id="loginScreen">
        <div class="hero"><span class="hero-icon">🍞</span><div class="hero-text">سجل دخولك للوصول إلى <span>منصة التوظيف</span></div></div>
        <div class="demo-box">🔑 <strong>مستخدمين تجريبيين:</strong><br> <strong>admin</strong> / 123456</div>
        <div class="form-group"><label>👤 اسم المستخدم</label><input type="text" id="loginUser" placeholder="أدخل اسم المستخدم"></div>
        <div class="form-group"><label>🔒 كلمة المرور</label><input type="password" id="loginPass" placeholder="••••••••"></div>
        <button class="btn btn-primary" onclick="login()">🚀 دخول</button>
        <div class="divider">ليس لديك حساب؟</div>
        <button class="btn btn-secondary" onclick="showScreen('registerScreen')">📝 إنشاء حساب جديد</button>
    </div>

    <!-- ====== التسجيل ====== -->
    <div class="screen" id="registerScreen">
        <button class="btn-back" onclick="showScreen('loginScreen')">← رجوع</button>
        <div class="hero"><span class="hero-icon">🎯</span><div class="hero-text">أنشئ حسابك واختر دورك</div></div>
        <div class="role-selector">
            <div class="role-card active" id="regRoleWorker" onclick="selectRegRole('worker')">
                <span class="icon">🎯</span><div class="label">مهني</div><div class="desc">أبحث عن عمل</div><span class="check">✅</span>
            </div>
            <div class="role-card" id="regRoleOwner" onclick="selectRegRole('owner')">
                <span class="icon">🏪</span><div class="label">صاحب منشأة</div><div class="desc">أبحث عن مهنيين</div><span class="check">✅</span>
            </div>
        </div>
        <div class="form-group"><label>👤 اسم المستخدم <span style="color:#b8652e;">*</span></label><input type="text" id="regUser" placeholder="أدخل اسماً فريداً"></div>
        <div class="form-group"><label>🔒 كلمة المرور <span style="color:#b8652e;">*</span></label><input type="password" id="regPass" placeholder="4 أحرف على الأقل"></div>
        <div class="form-group"><label>📍 المدينة <span style="color:#b8652e;">*</span></label><input type="text" id="regCity" placeholder="الدار البيضاء، مراكش..."></div>
        <div class="form-group"><label>📱 رقم الهاتف <span style="color:#b8652e;">*</span></label><input type="tel" id="regPhone" placeholder="0612345678"></div>
        <div class="form-group"><label>📝 وصف المهني أو المحل</label><textarea id="regBio" rows="2" style="width:100%;padding:12px 14px;border:2px solid #e8ddd2;border-radius:14px;font-size:14px;background:#faf7f4;outline:none;font-family:inherit;resize:vertical;min-height:60px" placeholder="مثال: خباز محترف خبرة 5 سنوات..."></textarea></div>
        <div class="form-group"><label>🏷️ قطاع عملك <span style="color:#b8652e;">*</span></label>
            <select id="regSector">
                <option value="">اختر القطاع</option>
                <option value="مخبز">🥖 مخبز</option>
                <option value="مقهى">☕ مقهى</option>
                <option value="مطعم">🍽️ مطعم</option>
                <option value="سناك">🍔 سناك</option>
                <option value="محلبات">🍦 محلبات</option>
                <option value="أخرى">📌 أخرى</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="register()">✅ إنشاء حساب</button>
        <button class="btn btn-secondary" onclick="showScreen('loginScreen')">🔙 لدي حساب بالفعل</button>
    </div>

    <!-- ====== اللوحة الرئيسية ====== -->
    <div class="screen" id="mainScreen">
        <div class="loading-spinner" id="mainLoading"><div class="spinner"></div>جاري التحميل...</div>
        <div id="mainContent" style="display:none;">
            <h2 style="text-align:center;color:#4a2c1b;">✅ مرحباً بك!</h2>
            <p style="text-align:center;color:#8b6b51;margin-top:10px;" id="welcomeMessage"></p>
            <div style="display:flex;gap:10px;margin-top:20px;">
                <button class="btn btn-primary" onclick="viewProfile()" style="flex:1;">👤 حسابي</button>
                <button class="btn btn-danger" onclick="logout()" style="flex:1;">🚪 خروج</button>
            </div>
        </div>
    </div>
</div>

<!-- ====== نافذة الملف الشخصي ====== -->
<div id="profileModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center;padding:20px;">
    <div style="background:#fff;border-radius:28px;padding:24px 20px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #f0e0d0;">
            <h3 style="color:#4a2c1b;font-size:18px;font-weight:800;">📋 الملف الشخصي</h3>
            <button onclick="document.getElementById('profileModal').style.display='none'" style="background:none;border:none;font-size:24px;cursor:pointer;color:#8b6b51;">✕</button>
        </div>
        <div id="profileModalBody"></div>
    </div>
</div>

<script>
    // ============================================================
    // 💾 نظام التخزين المحلي (بدون Firebase ولا Supabase)
    // ============================================================
    
    // جلب البيانات من LocalStorage
    function getData(key) {
        try {
            return JSON.parse(localStorage.getItem(key)) || [];
        } catch {
            return [];
        }
    }

    // حفظ البيانات في LocalStorage
    function setData(key, data) {
        localStorage.setItem(key, JSON.stringify(data));
    }

    // ============================================================
    // 📦 قاعدة البيانات المحلية
    // ============================================================
    let users = getData('khdma_users_local');
    let currentUser = null;

    // ============================================================
    // 🖥️ دوال الواجهة
    // ============================================================
    function showToast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.display = 'block';
        t.className = 'toast ' + type;
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showLoading(show) {
        document.getElementById('mainLoading').style.display = show ? 'block' : 'none';
        document.getElementById('mainContent').style.display = show ? 'none' : 'block';
    }

    // ============================================================
    // 🎯 اختيار الدور
    // ============================================================
    function selectRegRole(role) {
        document.querySelectorAll('#registerScreen .role-card').forEach(el => el.classList.remove('active'));
        document.getElementById(role === 'worker' ? 'regRoleWorker' : 'regRoleOwner').classList.add('active');
    }

    // ============================================================
    // 👤 الملف الشخصي
    // ============================================================
    function viewProfile() {
        if (!currentUser) {
            showToast('❌ يجب تسجيل الدخول أولاً', 'error');
            return;
        }
        const modal = document.getElementById('profileModal');
        const body = document.getElementById('profileModalBody');
        const data = currentUser;
        const roleText = data.role === 'owner' ? '🏪 صاحب منشأة' : '🎯 مهني';
        body.innerHTML = `
            <div style="text-align:center;padding:10px 0;">
                <div style="font-size:56px;margin-bottom:6px;">${data.role === 'owner' ? '🏪' : '🎯'}</div>
                <h3 style="color:#4a2c1b;">${data.displayName || data.username}</h3>
                <div style="color:#8b6b51;font-size:13px;margin-top:4px;">${roleText}</div>
                ${data.sector ? `<div style="color:#2d8f4e;font-size:13px;margin-top:2px;">${data.sector}</div>` : ''}
                <div style="margin-top:8px;font-size:13px;color:#8b6b51;">
                    <div>📍 ${data.city || 'غير محدد'}</div>
                    <div>📱 ${data.phone || 'غير متوفر'}</div>
                </div>
                ${data.bio ? `<div style="margin-top:10px;padding:10px;background:#faf7f4;border-radius:12px;color:#6e5543;font-size:14px;text-align:right;">${data.bio}</div>` : ''}
                <button class="btn btn-secondary" onclick="document.getElementById('profileModal').style.display='none'" style="margin-top:15px;">إغلاق</button>
            </div>
        `;
        modal.style.display = 'flex';
    }

    // ============================================================
    // 🔐 المصادقة (محلية)
    // ============================================================
    function register() {
        const username = document.getElementById('regUser').value.trim();
        const password = document.getElementById('regPass').value;
        const city = document.getElementById('regCity').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const bio = document.getElementById('regBio').value.trim();
        const sector = document.getElementById('regSector').value;
        const role = document.getElementById('regRoleOwner').classList.contains('active') ? 'owner' : 'worker';

        // التحقق من الحقول
        if (!username || !password || !city || !phone || !sector) {
            showToast('❌ الرجاء ملء جميع الحقول المطلوبة', 'error');
            return;
        }
        if (password.length < 4) {
            showToast('❌ كلمة المرور 4 أحرف على الأقل', 'error');
            return;
        }

        // التحقق من عدم تكرار الاسم
        if (users.find(u => u.username === username)) {
            showToast('❌ هذا الاسم موجود مسبقاً، اختر اسماً آخر', 'error');
            document.getElementById('regUser').classList.add('input-error');
            return;
        }

        // إنشاء المستخدم الجديد
        const newUser = {
            username: username,
            password: password,
            city: city,
            phone: phone,
            bio: bio || (role === 'worker' ? 'مهني محترف في مجال الأكل والشرب' : 'منشأة متخصصة في الأكل والشرب'),
            role: role,
            sector: sector,
            displayName: username,
            createdAt: new Date().toISOString()
        };

        users.push(newUser);
        setData('khdma_users_local', users);

        showToast('🎉 تم التسجيل بنجاح!', 'success');
        
        // تسجيل الدخول التلقائي
        currentUser = newUser;
        updateUI();
    }

    function login() {
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value;

        if (!username || !password) {
            showToast('❌ أدخل اسم المستخدم وكلمة المرور', 'error');
            return;
        }

        // البحث عن المستخدم
        const user = users.find(u => u.username === username && u.password === password);

        if (!user) {
            showToast('❌ اسم المستخدم أو كلمة المرور غير صحيحة', 'error');
            return;
        }

        currentUser = user;
        showToast('👋 مرحباً ' + user.displayName + '!', 'success');
        updateUI();
    }

    function logout() {
        currentUser = null;
        updateUI();
        showToast('👋 تم تسجيل الخروج', '');
    }

    // ============================================================
    // 🔄 تحديث الواجهة
    // ============================================================
    function updateUI() {
        const badge = document.getElementById('userBadge');
        const logoutBtn = document.getElementById('logoutBtn');

        if (currentUser) {
            badge.style.display = 'inline-flex';
            badge.textContent = '👋 ' + (currentUser.displayName || currentUser.username);
            logoutBtn.style.display = 'inline-block';
            document.getElementById('welcomeMessage').textContent = 'مرحباً ' + (currentUser.displayName || currentUser.username) + '!';
            showScreen('mainScreen');
            showLoading(false);
        } else {
            badge.style.display = 'none';
            logoutBtn.style.display = 'none';
            showScreen('loginScreen');
            showLoading(false);
        }
    }

    // ============================================================
    // 📦 بيانات تجريبية
    // ============================================================
    function initDemoData() {
        if (users.length === 0) {
            const demoUsers = [
                {
                    username: 'admin',
                    password: '123456',
                    city: 'الدار البيضاء',
                    phone: '0612345678',
                    role: 'owner',
                    sector: 'مطعم',
                    displayName: 'مدير المطعم',
                    bio: 'مطعم متخصص في الأكل المغربي',
                    createdAt: new Date().toISOString()
                },
                {
                    username: 'مهني_محمد',
                    password: '123456',
                    city: 'مراكش',
                    phone: '0612345679',
                    role: 'worker',
                    sector: 'مطعم',
                    displayName: 'محمد المهني',
                    bio: 'طباخ محترف خبرة 5 سنوات',
                    createdAt: new Date().toISOString()
                }
            ];
            users = demoUsers;
            setData('khdma_users_local', users);
            console.log('📦 تم إضافة مستخدمين تجريبيين');
        }
    }

    // ============================================================
    // 🚀 بدء التطبيق
    // ============================================================
    initDemoData();
    updateUI();

    console.log('🥖 تطبيق خدمة - جاهز!');
    console.log('👥 المستخدمين:', users.length);
    console.log('🔑 استخدم: admin / 123456 أو مهني_محمد / 123456');
</script>

</body>
</html>
