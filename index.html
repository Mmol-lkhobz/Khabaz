<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة - منصة التوظيف</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
        body{background:linear-gradient(145deg,#fdf6f0,#f5e8d8);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
        .app{max-width:450px;width:100%;background:#fff;border-radius:48px;padding:24px 20px 28px;box-shadow:0 30px 80px rgba(180,100,50,0.18)}
        .logo{text-align:center;font-size:34px;margin-bottom:4px}
        .logo-text{font-size:30px;font-weight:900;color:#3d2415}
        .logo-text .highlight{color:#d4833a}
        .subtitle{text-align:center;color:#8b6b51;font-size:12px;padding-bottom:12px;border-bottom:2px solid #f0e0d0;margin-bottom:16px}
        .screen{display:none;animation:fade .4s ease}
        .screen.active{display:block}
        @keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .form-group{margin-bottom:12px}
        .form-group label{display:block;font-size:13px;font-weight:700;color:#4a2c1b;margin-bottom:4px}
        .form-group input{width:100%;padding:12px 14px;border:2px solid #e8ddd2;border-radius:14px;font-size:14px;background:#faf7f4;outline:none}
        .form-group input:focus{border-color:#d4833a}
        .btn{padding:14px;border:none;border-radius:40px;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px;width:100%}
        .btn-primary{background:linear-gradient(145deg,#d4833a,#b8652e);color:#fff}
        .btn-primary:hover{background:linear-gradient(145deg,#c07230,#a3541e)}
        .btn-secondary{background:transparent;color:#d4833a;border:2px solid #d4833a}
        .btn-secondary:hover{background:#fdf3ea}
        .btn-danger{background:#e74c3c;color:#fff}
        .btn-danger:hover{background:#c0392b}
        .divider{text-align:center;color:#b0957e;margin:12px 0;font-size:12px}
        .divider::before,.divider::after{content:'';display:inline-block;width:30%;border-bottom:1px solid #e8ddd2;margin:0 10px;vertical-align:middle}
        .btn-back{background:0 0;border:none;color:#d4833a;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:10px}
        .toast{background:#3d2415;color:#fff;padding:12px;border-radius:14px;text-align:center;margin-top:12px;display:none;font-weight:700;font-size:14px}
        .toast.success{background:#2d8f4e}
        .toast.error{background:#c0392b}
        .demo-box{background:linear-gradient(135deg,#fdf3ea,#fef6ed);border-radius:14px;padding:10px;margin-bottom:14px;text-align:center;font-size:12px;color:#4a2c1b;border:1px solid #f0dcc8}
        .role-selector{display:flex;gap:10px;margin-bottom:16px}
        .role-card{flex:1;padding:12px;border:3px solid #e8ddd2;border-radius:18px;text-align:center;cursor:pointer;background:#faf7f4}
        .role-card.active{border-color:#d4833a;background:#fdf3ea;box-shadow:0 4px 24px rgba(212,131,58,0.15)}
        .role-card .icon{font-size:28px;display:block}
        .role-card .label{font-weight:800;color:#4a2c1b;font-size:12px;margin-top:3px}
        .role-card .check{display:none;color:#2d8f4e}
        .role-card.active .check{display:block}
        .user-badge{display:none;background:#fef3e7;padding:4px 14px;border-radius:40px;font-size:12px;color:#4a2c1b;font-weight:700;border:1px solid #f0dcc8}
        .btn-logout{display:none;background:0 0;border:none;color:#d4833a;font-size:18px;cursor:pointer;padding:4px 8px}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
        .flex{display:flex;gap:10px}
        .flex .btn{width:auto;flex:1}
        .hidden{display:none}
        .spinner{display:inline-block;width:30px;height:30px;border:3px solid #f0e0d0;border-top:3px solid #d4833a;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        .loading{text-align:center;padding:20px;color:#8b6b51}
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="logo">🥖🍽️</div>
        <div>
            <div class="logo-text"><span class="highlight">خ</span>دمة</div>
            <div style="font-size:10px;color:#8b6b51;font-weight:700;text-align:center">منصة التوظيف</div>
        </div>
        <div>
            <span class="user-badge" id="userBadge">👋</span>
            <button class="btn-logout" id="logoutBtn" onclick="logout()">🚪</button>
        </div>
    </div>
    <div class="subtitle">🥖 منصة التوظيف الأولى للمهنيين والمطاعم 🍽️</div>
    <div class="toast" id="toast"></div>

    <!-- ====== تسجيل الدخول ====== -->
    <div class="screen active" id="loginScreen">
        <div style="text-align:center;font-size:52px;margin-bottom:8px;">🍞</div>
        <div style="text-align:center;color:#8b6b51;font-size:14px;font-weight:700;margin-bottom:16px;">سجل دخولك للوصول إلى منصة التوظيف</div>
        <div class="demo-box">🔑 مستخدمين تجريبيين: <strong>test</strong> / 123456</div>
        <div class="form-group"><label>👤 اسم المستخدم</label><input type="text" id="loginUser" placeholder="أدخل اسم المستخدم"></div>
        <div class="form-group"><label>🔒 كلمة المرور</label><input type="password" id="loginPass" placeholder="••••••••"></div>
        <button class="btn btn-primary" id="loginBtn">🚀 دخول</button>
        <div class="divider">ليس لديك حساب؟</div>
        <button class="btn btn-secondary" id="showRegisterBtn">📝 إنشاء حساب جديد</button>
    </div>

    <!-- ====== التسجيل ====== -->
    <div class="screen" id="registerScreen">
        <button class="btn-back" id="backToLoginBtn">← رجوع</button>
        <div style="text-align:center;font-size:52px;margin-bottom:8px;">🎯</div>
        <div style="text-align:center;color:#8b6b51;font-size:14px;font-weight:700;margin-bottom:16px;">أنشئ حسابك واختر دورك</div>
        <div class="role-selector">
            <div class="role-card active" id="roleWorker">
                <span class="icon">🎯</span>
                <div class="label">مهني</div>
                <span class="check">✅</span>
            </div>
            <div class="role-card" id="roleOwner">
                <span class="icon">🏪</span>
                <div class="label">صاحب منشأة</div>
                <span class="check">✅</span>
            </div>
        </div>
        <div class="form-group"><label>👤 اسم المستخدم</label><input type="text" id="regUser" placeholder="أدخل اسماً فريداً"></div>
        <div class="form-group"><label>🔒 كلمة المرور</label><input type="password" id="regPass" placeholder="6 أحرف على الأقل"></div>
        <div class="form-group"><label>📍 المدينة</label><input type="text" id="regCity" placeholder="الدار البيضاء"></div>
        <div class="form-group"><label>📱 رقم الهاتف</label><input type="tel" id="regPhone" placeholder="0612345678"></div>
        <div class="form-group"><label>🏷️ القطاع</label>
            <select id="regSector" style="width:100%;padding:12px;border:2px solid #e8ddd2;border-radius:14px;font-size:14px;background:#faf7f4;outline:none">
                <option value="مطعم">🍽️ مطعم</option>
                <option value="مخبز">🥖 مخبز</option>
                <option value="مقهى">☕ مقهى</option>
                <option value="سناك">🍔 سناك</option>
                <option value="محلبات">🍦 محلبات</option>
            </select>
        </div>
        <button class="btn btn-primary" id="registerBtn">✅ إنشاء حساب</button>
        <button class="btn btn-secondary" id="backToLoginBtn2" style="margin-top:8px;">🔙 لدي حساب</button>
    </div>

    <!-- ====== اللوحة الرئيسية ====== -->
    <div class="screen" id="mainScreen">
        <div class="loading"><div class="spinner"></div><br>جاري التحميل...</div>
        <div id="mainContent" style="display:none;">
            <h2 style="text-align:center;color:#4a2c1b;">✅ مرحباً بك!</h2>
            <p style="text-align:center;color:#8b6b51;margin-top:10px;" id="welcomeMessage"></p>
            <div class="flex" style="margin-top:20px;">
                <button class="btn btn-primary" id="profileBtn" style="flex:1;">👤 حسابي</button>
                <button class="btn btn-danger" id="logoutBtn2" style="flex:1;">🚪 خروج</button>
            </div>
        </div>
    </div>
</div>

<!-- ====== نافذة الملف الشخصي ====== -->
<div id="profileModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center;padding:20px;">
    <div style="background:#fff;border-radius:28px;padding:24px;max-width:400px;width:100%;">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f0e0d0;padding-bottom:10px;margin-bottom:14px;">
            <h3 style="color:#4a2c1b;font-size:18px;font-weight:800;">📋 الملف الشخصي</h3>
            <button onclick="document.getElementById('profileModal').style.display='none'" style="background:none;border:none;font-size:24px;cursor:pointer;color:#8b6b51;">✕</button>
        </div>
        <div id="profileModalBody" style="text-align:center;padding:10px 0;"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ============================================================
    // 🔥 إعدادات Supabase
    // ============================================================
    const supabaseUrl = 'https://ynufjidcgeetvgldjjy.supabase.co';
    const supabaseKey = 'sb_publishable_SdGyYpmQXmYfDQjVcC7uYQ_j8TtheAU';
    
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);
    console.log('🔥 Supabase جاهز!');

    // ============================================================
    // 🖥️ ربط الأزرار
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        // ربط أزرار تسجيل الدخول
        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('showRegisterBtn').addEventListener('click', function() {
            showScreen('registerScreen');
        });
        document.getElementById('backToLoginBtn').addEventListener('click', function() {
            showScreen('loginScreen');
        });
        document.getElementById('backToLoginBtn2').addEventListener('click', function() {
            showScreen('loginScreen');
        });
        
        // ربط أزرار التسجيل
        document.getElementById('registerBtn').addEventListener('click', register);
        
        // ربط أزرار اللوحة الرئيسية
        document.getElementById('profileBtn').addEventListener('click', viewProfile);
        document.getElementById('logoutBtn2').addEventListener('click', logout);
        
        // اختيار الدور
        document.getElementById('roleWorker').addEventListener('click', function() {
            selectRole('worker');
        });
        document.getElementById('roleOwner').addEventListener('click', function() {
            selectRole('owner');
        });
    });

    // ============================================================
    // 📦 المتغيرات
    // ============================================================
    let currentUserData = null;
    let selectedRole = 'worker';

    // ============================================================
    // 🖥️ دوال الواجهة
    // ============================================================
    function showToast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.display = 'block';
        t.className = 'toast ' + type;
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showLoading(show) {
        document.getElementById('mainContent').style.display = show ? 'none' : 'block';
        document.querySelector('#mainScreen .loading').style.display = show ? 'block' : 'none';
    }

    function selectRole(role) {
        selectedRole = role;
        document.querySelectorAll('.role-card').forEach(el => el.classList.remove('active'));
        document.getElementById(role === 'worker' ? 'roleWorker' : 'roleOwner').classList.add('active');
    }

    // ============================================================
    // 👤 الملف الشخصي
    // ============================================================
    function viewProfile() {
        if (!currentUserData) {
            showToast('❌ يجب تسجيل الدخول أولاً', 'error');
            return;
        }
        const modal = document.getElementById('profileModal');
        const body = document.getElementById('profileModalBody');
        const data = currentUserData;
        const roleText = data.role === 'owner' ? '🏪 صاحب منشأة' : '🎯 مهني';
        body.innerHTML = `
            <div style="font-size:56px;margin-bottom:6px;">${data.role === 'owner' ? '🏪' : '🎯'}</div>
            <h3 style="color:#4a2c1b;">${data.display_name || data.username}</h3>
            <div style="color:#8b6b51;font-size:13px;">${roleText}</div>
            ${data.sector ? `<div style="color:#2d8f4e;font-size:13px;">${data.sector}</div>` : ''}
            <div style="margin-top:8px;font-size:13px;color:#8b6b51;">
                <div>📍 ${data.city || 'غير محدد'}</div>
                <div>📱 ${data.phone || 'غير متوفر'}</div>
            </div>
            ${data.bio ? `<div style="margin-top:10px;padding:10px;background:#faf7f4;border-radius:12px;color:#6e5543;font-size:14px;">${data.bio}</div>` : ''}
            <button class="btn btn-secondary" onclick="document.getElementById('profileModal').style.display='none'" style="margin-top:15px;">إغلاق</button>
        `;
        modal.style.display = 'flex';
    }

    // ============================================================
    // 🔐 المصادقة
    // ============================================================
    async function register() {
        console.log('🟢 زر التسجيل!');
        
        const username = document.getElementById('regUser').value.trim();
        const password = document.getElementById('regPass').value;
        const city = document.getElementById('regCity').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const sector = document.getElementById('regSector').value;
        const role = selectedRole;

        if (!username || !password || !city || !phone) {
            showToast('❌ الرجاء ملء جميع الحقول', 'error');
            return;
        }
        if (password.length < 6) {
            showToast('❌ كلمة المرور 6 أحرف على الأقل', 'error');
            return;
        }

        const email = username + '@khdma.app';
        console.log('📧 التسجيل:', email);

        try {
            const { data: authData, error: authError } = await supabase.auth.signUp({
                email: email,
                password: password
            });

            if (authError) {
                console.error('❌', authError);
                if (authError.message.includes('already registered')) {
                    showToast('❌ هذا الاسم مستخدم', 'error');
                } else {
                    showToast('❌ ' + authError.message, 'error');
                }
                return;
            }

            if (!authData.user) {
                showToast('❌ حدث خطأ', 'error');
                return;
            }

            console.log('✅ تم إنشاء المستخدم:', authData.user.id);

            const { error: dbError } = await supabase
                .from('users')
                .insert({
                    id: authData.user.id,
                    username: username,
                    email: email,
                    city: city,
                    phone: phone,
                    bio: role === 'worker' ? 'مهني محترف' : 'منشأة متخصصة',
                    role: role,
                    sector: sector,
                    display_name: username,
                    created_at: new Date().toISOString()
                });

            if (dbError) {
                console.error('❌', dbError);
                showToast('❌ حدث خطأ في حفظ البيانات', 'error');
                return;
            }

            showToast('🎉 تم التسجيل بنجاح!', 'success');
            console.log('✅ تم حفظ البيانات');
            
        } catch (error) {
            console.error('❌', error);
            showToast('❌ ' + error.message, 'error');
        }
    }

    async function login() {
        console.log('🟢 زر الدخول!');
        
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value;

        if (!username || !password) {
            showToast('❌ أدخل اسم المستخدم وكلمة المرور', 'error');
            return;
        }

        const email = username + '@khdma.app';
        console.log('📧 الدخول:', email);

        try {
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                console.error('❌', error);
                if (error.message.includes('Invalid login credentials')) {
                    showToast('❌ اسم المستخدم أو كلمة المرور غير صحيحة', 'error');
                } else {
                    showToast('❌ ' + error.message, 'error');
                }
                return;
            }

            if (data.user) {
                console.log('✅ تم تسجيل الدخول:', data.user.id);
            }
        } catch (error) {
            console.error('❌', error);
            showToast('❌ ' + error.message, 'error');
        }
    }

    async function logout() {
        try {
            await supabase.auth.signOut();
            showToast('👋 تم تسجيل الخروج', '');
        } catch (error) {
            showToast('❌ ' + error.message, 'error');
        }
    }

    // ============================================================
    // 🔄 مراقبة حالة المستخدم
    // ============================================================
    supabase.auth.onAuthStateChange(async (event, session) => {
        console.log('🔄 تغير الحالة:', event, session ? 'مسجل' : 'غير مسجل');
        showLoading(true);

        if (session?.user) {
            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (error) {
                console.error('❌', error);
                currentUserData = null;
                updateUI(null);
                return;
            }

            if (data) {
                currentUserData = data;
                updateUI(data);
            } else {
                currentUserData = null;
                updateUI(null);
            }
        } else {
            currentUserData = null;
            updateUI(null);
        }
    });

    // ============================================================
    // 🔄 تحديث الواجهة
    // ============================================================
    function updateUI(userData) {
        const badge = document.getElementById('userBadge');
        const logoutBtn = document.getElementById('logoutBtn');

        if (userData) {
            badge.style.display = 'inline-block';
            badge.textContent = '👋 ' + (userData.display_name || userData.username);
            logoutBtn.style.display = 'inline-block';
            document.getElementById('welcomeMessage').textContent = 'مرحباً ' + (userData.display_name || userData.username) + '!';
            showScreen('mainScreen');
            showLoading(false);
        } else {
            badge.style.display = 'none';
            logoutBtn.style.display = 'none';
            showScreen('loginScreen');
            showLoading(false);
        }
    }

    console.log('🥖 تطبيق خدمة جاهز!');
    console.log('🔑 استخدم: test / 123456');
</script>

</body>
</html>
